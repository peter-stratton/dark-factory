repo: peter-stratton/dark-factory
auto_merge: all
protected_paths: ["CLAUDE.md", "tests/scenarios/"]

wait_for_checks:
  timeout: 10m
  required: [test]

runtime:
  name: go
  version: "1.26.0"

notify:
  - provider: telegram
    events: [run_complete, abort]
    settings:
      bot_token: ${TELEGRAM_BOT_TOKEN}
      chat_id: ${TELEGRAM_CHAT_ID}
