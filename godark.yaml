repo: peter-stratton/dark-factory
auto_merge:
  feature: all
  rollup: none
protected_paths: ["CLAUDE.md", "tests/scenarios/"]

wait_for_checks:
  timeout: 10m
  required: [test, lint]

lint_command: "golangci-lint run ./..."

docker:
  install_commands:
    - "curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin"

runtime:
  name: go
  version: "1.26.0"

notify:
  - provider: telegram
    events: [run_complete, abort]
    settings:
      bot_token: ${TELEGRAM_BOT_TOKEN}
      chat_id: ${TELEGRAM_CHAT_ID}
