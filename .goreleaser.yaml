version: 2

builds:
  - main: ./cmd/godark
    binary: godark
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/phs/dark-factory/internal/cmd.Version={{.Version}}
      - -X github.com/phs/dark-factory/internal/cmd.BuildTime={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - formats:
      - tar.gz

changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: godark
    repository:
      owner: peter-stratton
      name: homebrew-dark-factory
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/peter-stratton/dark-factory
    description: CLI that orchestrates autonomous AI agents to implement GitHub issues
